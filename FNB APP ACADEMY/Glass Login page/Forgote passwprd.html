<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#241b3b">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video src="videos/narutos-restful-thoughts.3840x2160.mp4" autoplay loop muted playsinline aria-hidden="true"></video>

    <main class="glass-container registration-container">
        <h2>Forgot your password?</h2>
        <p class="registration-intro">Choose where you would like to receive password reset instructions.</p>

        <form id="forgotPasswordForm" novalidate>
            <fieldset class="recovery-options">
                <legend>Recovery method</legend>
                <label><input type="radio" name="recoveryMethod" value="email" checked> Email</label>
                <label><input type="radio" name="recoveryMethod" value="phone"> Cellphone</label>
            </fieldset>

            <div id="emailFields">
                <div class="input-group">
                    <input type="email" id="email" name="email" autocomplete="email" required>
                    <label for="email">Email address</label>
                </div>
            </div>

            <div id="phoneFields" class="phone-fields" hidden>
                <div class="country-code-field">
                    <label for="countryCode">Country code</label>
                    <select id="countryCode" name="countryCode" autocomplete="tel-country-code" disabled>
                        <option value="+27" selected>South Africa (+27)</option>
                        <option value="+1">United States / Canada (+1)</option>
                        <option value="+44">United Kingdom (+44)</option>
                        <option value="+61">Australia (+61)</option>
                        <option value="+64">New Zealand (+64)</option>
                        <option value="+91">India (+91)</option>
                        <option value="+234">Nigeria (+234)</option>
                        <option value="+254">Kenya (+254)</option>
                        <option value="+255">Tanzania (+255)</option>
                        <option value="+256">Uganda (+256)</option>
                        <option value="+263">Zimbabwe (+263)</option>
                        <option value="+264">Namibia (+264)</option>
                        <option value="+267">Botswana (+267)</option>
                        <option value="+260">Zambia (+260)</option>
                        <option value="+265">Malawi (+265)</option>
                        <option value="+258">Mozambique (+258)</option>
                        <option value="+33">France (+33)</option>
                        <option value="+49">Germany (+49)</option>
                        <option value="+81">Japan (+81)</option>
                        <option value="+86">China (+86)</option>
                        <option value="+971">United Arab Emirates (+971)</option>
                        <option value="+966">Saudi Arabia (+966)</option>
                        <option value="+55">Brazil (+55)</option>
                        <option value="+52">Mexico (+52)</option>
                    </select>
                </div>

                <div class="input-group phone-number-field">
                    <input type="tel" id="phoneNumber" name="phoneNumber" autocomplete="tel-national" inputmode="numeric" minlength="7" maxlength="15" pattern="[0-9]{7,15}" disabled>
                    <label for="phoneNumber">Cellphone number</label>
                </div>
            </div>

            <button type="submit" class="login-btn">Send reset instructions</button>
            <p id="resetMessage" class="registration-message" aria-live="polite"></p>
        </form>

        <div class="register-link">
            <p>Remembered your password? <a href="login.html">Back to log in</a></p>
        </div>
    </main>

    <script>
        const forgotPasswordForm = document.getElementById('forgotPasswordForm');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phoneNumber');
        const countryCodeInput = document.getElementById('countryCode');
        const emailFields = document.getElementById('emailFields');
        const phoneFields = document.getElementById('phoneFields');
        const resetMessage = document.getElementById('resetMessage');

        forgotPasswordForm.querySelectorAll('input[name="recoveryMethod"]').forEach((methodInput) => {
            methodInput.addEventListener('change', () => {
                const usePhone = methodInput.value === 'phone' && methodInput.checked;
                emailFields.hidden = usePhone;
                phoneFields.hidden = !usePhone;
                emailInput.disabled = usePhone;
                emailInput.required = !usePhone;
                phoneInput.disabled = !usePhone;
                phoneInput.required = usePhone;
                countryCodeInput.disabled = !usePhone;
                countryCodeInput.required = usePhone;
                resetMessage.textContent = '';
                resetMessage.classList.remove('is-error');
            });
        });

        forgotPasswordForm.addEventListener('submit', (event) => {
            event.preventDefault();
            resetMessage.classList.remove('is-error');

            if (!forgotPasswordForm.checkValidity()) {
                resetMessage.textContent = emailInput.disabled
                    ? 'Enter a cellphone number with 7 to 15 digits.'
                    : 'Enter a valid email address.';
                resetMessage.classList.add('is-error');
                forgotPasswordForm.reportValidity();
                (emailInput.disabled ? phoneInput : emailInput).focus();
                return;
            }

            resetMessage.textContent = 'Password reset is not configured for this app yet. Please contact support for help signing in.';
            resetMessage.classList.add('is-error');
        });
    </script>
</body>
</html>
