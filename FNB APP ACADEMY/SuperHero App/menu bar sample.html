<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Bar Template</title>
  <style>
    /* General Reset */
    body, ul, li {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    /* Navigation Bar */
    .navbar {
      background-color: #333;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .navbar ul {
      display: flex;
    }

    .navbar li {
      margin: 0 10px;
    }

    .navbar a {
      text-decoration: none;
      color: white;
      padding: 10px 15px;
      display: block;
      transition: background-color 0.3s ease;
    }

    .navbar a:hover {
      background-color: #575757;
      border-radius: 5px;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .navbar ul {
        flex-direction: column;
        align-items: flex-start;
      }

      .navbar a {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">
        <a href="#" style="color: white; font-size: 20px; font-weight: bold;">MyLogo</a>
      </div>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="home" style="padding: 20px;">
      <h1>Welcome to My Website</h1>
      <p>This is a simple template with a menu bar.</p>
    </section>
  </main>
</body>
</html>
